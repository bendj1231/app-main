# Cloudflare Worker configuration for pilotshortage.org
# Satellite of pilotrecognition.com — same D1, same Auth0 tenant
name = "pilotshortage-api"
main = "pilotshortage-worker.ts"
compatibility_date = "2025-06-19"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "pilotrecognition-reference-data"
database_id = "1a59c397-fa2a-4a5f-b557-87b54230b202"

[vars]
AUTH0_DOMAIN = "dev-ir828tguibp1dh5f.eu.auth0.com"
AUTH0_AUDIENCE = "https://dev-ir828tguibp1dh5f.eu.auth0.com/api/v2/"
