# Cloudflare Worker — Aviation Reference Data (Pathways)
# Handles manufacturers, aircraft type ratings, training requirements, simulator locations

name = "pilotcareerpathways-api"
main = "pathway-worker.ts"
compatibility_date = "2025-06-19"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# D1 Database bindings — 5-database segregated architecture
# DB = reference data (manufacturers, aircraft, training requirements, simulator locations)
# DB_OPS = operational ecosystem (airlines, ATOs, TRCs, pathways, charters)
# DB_PROFILES = pilot identity & verification (profiles, verifications, connect requests)
# DB_TRACE = audit & compliance (security events, audit logs, consent journal)
# DB_DOCS = content & evidence (stories, documents, moderation log)

[[d1_databases]]
binding = "DB"
database_name = "pilotrecognition-reference-data"
database_id = "1a59c397-fa2a-4a5f-b557-87b54230b202"

[[d1_databases]]
binding = "DB_OPS"
database_name = "pilotrecognition-d1"
database_id = "0652ca22-adb0-4642-8658-ccc3ad74d263"

[[d1_databases]]
binding = "DB_PROFILES"
database_name = "pilotrecognition-profiles"
database_id = "2a2b2862-a310-41c3-9d95-f13a85f4f6f4"

[[d1_databases]]
binding = "DB_TRACE"
database_name = "recognition-plus-trace"
database_id = "4ca6354b-fc0b-4bfd-86cf-532babf74af9"

[[d1_databases]]
binding = "DB_DOCS"
database_name = "apc-document-metadata"
database_id = "4ffbd2f3-c424-437a-80ea-b3d75b896afb"

# Environment variables
[vars]
AUTH0_DOMAIN = "dev-ir828tguibp1dh5f.eu.auth0.com"
AUTH0_AUDIENCE = "https://dev-ir828tguibp1dh5f.eu.auth0.com/api/v2/"

# Secrets (set with `wrangler secret put --config wrangler.pathway.toml`):
# (none currently)
