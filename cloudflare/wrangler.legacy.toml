# Pilot Public API — read-only public access to pilot data
# Public profile cards, leaderboard, search (no auth required)

name = "pilot-public-api"
main = "legacy-worker.ts"
compatibility_date = "2025-06-19"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

