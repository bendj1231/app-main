# Cloudflare Worker configuration for PilotRecognition API
# This replaces Supabase Edge Functions and direct client queries

name = "pilotrecognition-api"
main = "worker.ts"
compatibility_date = "2025-06-19"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# D1 Database binding — your SQLite database at the edge
[[d1_databases]]
binding = "DB"
database_name = "pilotrecognition-d1"
# Replace with your actual D1 database ID after creation:
# Run: npx wrangler d1 create pilotrecognition-d1
database_id = "0652ca22-adb0-4642-8658-ccc3ad74d263"

# Environment variables
[vars]
AUTH0_DOMAIN = "dev-ir828tguibp1dh5f.eu.auth0.com"
AUTH0_AUDIENCE = "https://dev-ir828tguibp1dh5f.eu.auth0.com/api/v2/"
DODO_PRODUCT_ID_RECOGNITION_PLUS = "pdt_0NhgDLaiGjWD45S1gJmng"
DODO_ENV = "test" # Set to "live" for production

# Secrets (set these with `wrangler secret put`):
# DODO_API_KEY = "your_dodo_api_key"
# DODO_WEBHOOK_SECRET = "your_dodo_webhook_secret"
# VEREMARK_WEBHOOK_SECRET = "your_veremark_webhook_secret"

# R2 Bucket for encrypted document storage (verification uploads, consent forms, licenses)
[[r2_buckets]]
binding = "VAULT"
bucket_name = "pilot-encrypted-vault"

# Daily cron: purge expired verification documents (30 days post-result)
[triggers]
crons = ["0 0 * * *"]

# Optional: KV for caching or rate limiting
# [[kv_namespaces]]
# binding = "CACHE"
# id = "your_kv_namespace_id"
