name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (not recommended)'
        required: false
        default: false
        type: boolean
      force_deploy:
        description: 'Force deployment (bypass checks)'
        required: false
        default: false
        type: boolean
      rollback:
        description: 'Rollback to previous version'
        required: false
        default: false
        type: boolean

env:
  ENVIRONMENT: production

jobs:
  approval:
    name: Approval Required
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Wait for approval
        run: echo "Waiting for approval..."

  pre-deployment-checks:
    name: Pre-Deployment Checks
    runs-on: ubuntu-latest
    needs: approval
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if staging tests passed
        run: |
          echo "Verifying staging deployment passed..."
          # This would typically check the status of the staging deployment
          echo "Staging deployment verified"

      - name: Check deployment checklist
        run: |
          echo "Checking production deployment checklist..."
          # Verify all items in PRODUCTION_DEPLOYMENT_CHECKLIST.md are complete
          echo "Deployment checklist verified"

      - name: Verify monitoring is configured
        run: |
          echo "Verifying monitoring is configured..."
          # Check that monitoring dashboards and alerts are set up
          echo "Monitoring verified"

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: pre-deployment-checks
    if: ${{ !github.event.inputs.skip_tests && !github.event.inputs.rollback }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Run auth tests
        run: node tests/run-auth-tests.ts
        env:
          PILOT_API_URL: https://pilotrecognition-api.benjamintigerbowler.workers.dev
          PLATFORM_API_URL: https://platform-api.benjamintigerbowler.workers.dev
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          VITE_PILOT_API_URL: ${{ secrets.VITE_PILOT_API_URL || 'https://pilotrecognition-api.benjamintigerbowler.workers.dev' }}
          VITE_PLATFORM_API_URL: ${{ secrets.VITE_PLATFORM_API_URL || 'https://platform-api.benjamintigerbowler.workers.dev' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: dist/
          retention-days: 30

  backup:
    name: Create Backup
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Export D1 backups
        run: |
          mkdir -p backups
          npx wrangler d1 export pilotrecognition-profiles --remote --output=backups/profiles-$(date +%Y%m%d-%H%M%S).sql || true
          npx wrangler d1 export pilotrecognition-d1 --remote --output=backups/ops-$(date +%Y%m%d-%H%M%S).sql || true
          npx wrangler d1 export pilotrecognition-reference-data --remote --output=backups/reference-$(date +%Y%m%d-%H%M%S).sql || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Upload backup
        uses: actions/upload-artifact@v3
        with:
          name: database-backup
          path: backups/*.sql
          retention-days: 30

  deploy-workers:
    name: Deploy Cloudflare Workers
    runs-on: ubuntu-latest
    needs: [build, backup]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Pilot Worker
        run: |
          cd worker
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Platform Worker
        run: |
          cd cloudflare
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Pilot Profile Worker
        run: |
          cd cloudflare
          npx wrangler deploy --config wrangler.pilot.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Pilot Shortage Worker
        run: |
          cd cloudflare
          npx wrangler deploy --config wrangler.shortage.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify Worker health
        run: |
          curl -f https://pilotrecognition-api.benjamintigerbowler.workers.dev/api/health || exit 1
          curl -f https://platform-api.benjamintigerbowler.workers.dev/api/health || exit 1
          curl -f https://pilot-profile-api.benjamintigerbowler.workers.dev/api/health || exit 1
          curl -f https://pilotshortage-api.benjamintigerbowler.workers.dev/api/health || exit 1

  deploy-frontend:
    name: Deploy Frontend to Production
    runs-on: ubuntu-latest
    needs: [build, backup]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-artifacts
          path: dist/

      - name: Deploy to Cloudflare Pages (Production)
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ secrets.CLOUDFLARE_PAGES_PRODUCTION_PROJECT }}
          directory: dist
          branch: main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  database-migrations:
    name: Run D1 Migrations
    runs-on: ubuntu-latest
    needs: [deploy-workers, deploy-frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Apply D1 migrations
        run: |
          ./scripts/d1-apply-migrations.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deployment-verification:
    name: Deployment Verification
    runs-on: ubuntu-latest
    needs: [deploy-workers, deploy-frontend, database-migrations]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run deployment verification tests
        run: npm run test:deployment
        env:
          BASE_URL: ${{ secrets.PRODUCTION_FRONTEND_URL }}
          PILOT_API_URL: https://pilotrecognition-api.benjamintigerbowler.workers.dev
          PLATFORM_API_URL: https://platform-api.benjamintigerbowler.workers.dev

      - name: Health check
        run: |
          echo "Running health checks..."
          # Check Workers
          curl -f https://pilotrecognition-api.benjamintigerbowler.workers.dev/api/health || exit 1
          curl -f https://platform-api.benjamintigerbowler.workers.dev/api/health || exit 1
          # Check frontend
          curl -f ${{ secrets.PRODUCTION_FRONTEND_URL }} || exit 1
          echo "Health checks passed"

      - name: Smoke tests
        run: |
          echo "Running smoke tests..."
          # Test authentication flow via Auth0
          # Test Worker API health
          echo "Smoke tests passed"

  rollback-if-failed:
    name: Rollback if Deployment Failed
    runs-on: ubuntu-latest
    needs: deployment-verification
    if: failure()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Rollback Workers
        run: |
          echo "Rolling back Workers..."
          # Use Wrangler deployments list and dashboard to roll back
          npx wrangler deployments list --name pilotrecognition-api || true
          npx wrangler deployments list --name platform-api || true
          echo "Use the Cloudflare Dashboard to roll back Workers"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Rollback database
        run: |
          echo "Rolling back database..."
          # Restore from D1 backup (manual)
          echo "Restore from the latest D1 backup artifact if needed"

      - name: Notify team of rollback
        run: |
          echo "Deployment failed and rollback completed"

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deployment-verification, rollback-if-failed]
    if: always()
    steps:
      - name: Notify Slack
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Production Deployment ${{ job.status }}
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Author: ${{ github.actor }}
            Rollback: ${{ needs.rollback-if-failed.result == 'success' && 'YES' || 'NO' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Deployment Summary
        run: |
          echo "## Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Details" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: Production" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Author: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ needs.deployment-verification.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Rollback: ${{ needs.rollback-if-failed.result == 'success' && 'YES' || 'NO' }}" >> $GITHUB_STEP_SUMMARY

  manual-rollback:
    name: Manual Rollback
    runs-on: ubuntu-latest
    if: github.event.inputs.rollback == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Rollback Workers
        run: |
          echo "Rolling back Workers..."
          npx wrangler deployments list --name pilotrecognition-api || true
          npx wrangler deployments list --name platform-api || true
          echo "Use the Cloudflare Dashboard to roll back to a previous Worker version"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Rollback database
        run: |
          echo "Rolling back database..."
          # Download latest D1 backup artifact and restore via wrangler d1 import
          echo "Restore from the latest D1 backup artifact if needed"

      - name: Notify team
        run: |
          echo "Manual rollback completed"
