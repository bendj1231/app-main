name: Deploy to Staging

on:
  push:
    branches: [ develop ]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (not recommended)'
        required: false
        default: false
        type: boolean
      force_deploy:
        description: 'Force deployment (bypass checks)'
        required: false
        default: false
        type: boolean

env:
  ENVIRONMENT: staging

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: ${{ !github.event.inputs.skip_tests }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Run auth tests
        run: node tests/run-auth-tests.ts
        env:
          PILOT_API_URL: https://pilotrecognition-api.benjamintigerbowler.workers.dev
          PLATFORM_API_URL: https://platform-api.benjamintigerbowler.workers.dev
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          VITE_PILOT_API_URL: ${{ secrets.VITE_PILOT_API_URL || 'https://pilotrecognition-api.benjamintigerbowler.workers.dev' }}
          VITE_PLATFORM_API_URL: ${{ secrets.VITE_PLATFORM_API_URL || 'https://platform-api.benjamintigerbowler.workers.dev' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: dist/
          retention-days: 7

  deploy-workers:
    name: Deploy Cloudflare Workers
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Pilot Worker
        run: |
          cd worker
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Platform Worker
        run: |
          cd cloudflare
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Pilot Profile Worker
        run: |
          cd cloudflare
          npx wrangler deploy --config wrangler.pilot.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Pilot Shortage Worker
        run: |
          cd cloudflare
          npx wrangler deploy --config wrangler.shortage.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify Worker health
        run: |
          curl -f https://pilotrecognition-api.benjamintigerbowler.workers.dev/api/health || exit 1
          curl -f https://platform-api.benjamintigerbowler.workers.dev/api/health || exit 1
          curl -f https://pilot-profile-api.benjamintigerbowler.workers.dev/api/health || exit 1
          curl -f https://pilotshortage-api.benjamintigerbowler.workers.dev/api/health || exit 1

  deploy-frontend:
    name: Deploy Frontend to Staging
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-artifacts
          path: dist/

      - name: Deploy to Cloudflare Pages (Staging)
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ secrets.CLOUDFLARE_PAGES_STAGING_PROJECT }}
          directory: dist
          branch: develop
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  database-migrations:
    name: Run D1 Migrations
    runs-on: ubuntu-latest
    needs: [deploy-workers, deploy-frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Apply D1 migrations
        run: |
          ./scripts/d1-apply-migrations.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deployment-verification:
    name: Deployment Verification
    runs-on: ubuntu-latest
    needs: [deploy-workers, deploy-frontend, database-migrations]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Health check
        run: |
          echo "Running health checks..."
          # Check Workers
          curl -f https://pilotrecognition-api.benjamintigerbowler.workers.dev/api/health || exit 1
          curl -f https://platform-api.benjamintigerbowler.workers.dev/api/health || exit 1
          curl -f https://pilot-profile-api.benjamintigerbowler.workers.dev/api/health || exit 1
          # pilotshortage-api has no /api/health endpoint; check the root responds
          curl -f https://pilotshortage-api.benjamintigerbowler.workers.dev || true
          # Check frontend
          curl -f ${{ secrets.STAGING_FRONTEND_URL }} || exit 1
          echo "Health checks passed"

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deployment-verification]
    if: always()
    steps:
      - name: Deployment Summary
        run: |
          echo "## Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Details" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: Staging" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Author: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ needs.deployment-verification.result }}" >> $GITHUB_STEP_SUMMARY
